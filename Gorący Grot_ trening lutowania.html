<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5b37">
<title>Gorący Grot: trening lutowania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{
  --display:"Chakra Petch","Barlow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#dfe6e1; --ink:#0f1d17; --muted:#475a51;
  --mask:#0f5b37; --mask-2:#13693f; --mask-3:#0b4a2c; --mask-ink:#eef6f0; --mask-muted:rgba(238,246,240,.76);
  --silk:rgba(243,246,241,.6); --tin:#cfd3ce; --hole:#07120d;
  --hot:#ff8a3d; --hot-ink:#1c0b02; --good:#86e6b0; --bad:#ffb4a8; --gold:#ffd166;
  --overlay:rgba(5,16,11,.46);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#08120e; --ink:#e6f0eb; --muted:#9db4a9; --mask:#0d5332; --mask-2:#106039; --mask-3:#093f26; --overlay:rgba(1,6,4,.6); color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#08120e; --ink:#e6f0eb; --muted:#9db4a9; --mask:#0d5332; --mask-2:#106039; --mask-3:#093f26; --overlay:rgba(1,6,4,.6); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
body.playing #stage canvas{cursor:crosshair}

/* Interfejs wygląda jak kawałek płytki: soldermaska, sitodruk, otwory montażowe */
.pcb{position:relative;background:var(--mask);color:var(--mask-ink);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.26)}
.pcb::before{content:"";position:absolute;inset:7px;border:1.5px solid var(--silk);border-radius:5px;pointer-events:none}
.pcb::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:
    radial-gradient(circle at 15px 15px,var(--hole) 0 2.6px,var(--tin) 3px 4.6px,transparent 5px),
    radial-gradient(circle at calc(100% - 15px) 15px,var(--hole) 0 2.6px,var(--tin) 3px 4.6px,transparent 5px),
    radial-gradient(circle at 15px calc(100% - 15px),var(--hole) 0 2.6px,var(--tin) 3px 4.6px,transparent 5px),
    radial-gradient(circle at calc(100% - 15px) calc(100% - 15px),var(--hole) 0 2.6px,var(--tin) 3px 4.6px,transparent 5px)}
.chip{display:inline-block;font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.03em;line-height:1;
  padding:4px 6px;border:1.5px solid var(--mask-ink);border-radius:3px;color:var(--mask-ink);white-space:nowrap}

.loading{position:fixed;inset:0;z-index:40;display:grid;place-content:center;gap:8px;text-align:center;background:var(--bg);color:var(--ink);padding:20px}
.loading .t{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,8vw,3.8rem);line-height:1;margin:0;letter-spacing:-.02em}
.loading p{margin:0;color:var(--muted)}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.hud .pcb{pointer-events:auto}
.hud-card{width:min(25rem,100%);padding:20px 22px 16px}
.hud-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-family:var(--display);font-weight:600;font-size:.92rem;color:var(--mask-muted)}
.prog{display:flex;gap:4px;margin-bottom:10px}
.prog i{flex:1;height:5px;border-radius:3px;background:rgba(238,246,240,.18)}
.prog i.now{background:var(--gold)}
.prog i.good{background:var(--good)}
.prog i.bad{background:var(--bad)}
.hud h1{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.2;margin:0 0 4px}
.hint{margin:0 0 10px;color:var(--mask-muted);font-size:.95rem;min-height:2.8em;max-width:46ch}
.hint.guided{color:var(--mask-ink);font-size:1.02rem}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter .lbl{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;color:var(--mask-muted);margin-bottom:4px}
.meter .lbl b{font-weight:600;color:var(--mask-ink)}
.bar{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.3);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:var(--hot)}
.bar .fill.solder{background:var(--tin)}
.bar .fill.warn{background:var(--bad)}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(134,230,176,.22);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.feedback{margin:10px 0 0;padding-top:8px;border-top:1.5px dashed var(--silk);font-size:.92rem;max-width:46ch}
.feedback:empty{display:none}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.score-card{padding:18px 22px 14px;text-align:right;min-width:9.5rem}
.score{margin:0;font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.9rem;margin-left:4px;color:var(--mask-muted)}
.combo{margin:6px 0 0;font-family:var(--display);font-weight:700;color:var(--gold);min-height:1.2em}
.timer{margin:2px 0 0;font-variant-numeric:tabular-nums;color:var(--mask-muted)}
.timer.low{color:var(--bad)}

/* przyciski */
button{font:inherit;font-weight:600;line-height:1.2;border-radius:8px;border:1.5px solid var(--silk);background:transparent;color:var(--mask-ink);
  padding:11px 16px;min-height:46px;cursor:pointer;text-align:center}
button small{display:block;font-weight:500;font-size:.8rem;color:var(--mask-muted);margin-top:3px}
button.primary{background:var(--hot);border-color:transparent;color:var(--hot-ink)}
button.primary small{color:rgba(28,11,2,.75)}
button:hover:not(:disabled){border-color:var(--mask-ink)}
button.primary:hover:not(:disabled){filter:brightness(1.06)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}

.controls{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:flex-end;gap:10px;
  padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.controls button{pointer-events:auto;background:var(--mask);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.spacer{flex:1}
#solderBtn{min-width:12rem;min-height:64px;text-align:left;touch-action:none;-webkit-touch-callout:none;background:var(--tin);color:#16201b;border-color:transparent}
#solderBtn small{color:#3e4a44}
#solderBtn.active{background:var(--hot);color:var(--hot-ink)}

/* okna dialogowe */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--overlay);
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.overlay.sheet{place-items:end center;background:transparent;pointer-events:none}
.overlay.sheet .dialog{pointer-events:auto;width:min(42rem,100%);max-height:56%}
.dialog{width:min(34rem,100%);max-height:100%;overflow:auto;padding:30px 30px 26px}
.dialog.menu{width:min(60rem,100%)}
.dialog.results{width:min(38rem,100%)}
.dlg-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dialog h2{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.15;margin:0}
.dialog.menu h2{font-size:clamp(2.4rem,7vw,4.2rem);line-height:.95;letter-spacing:-.02em}
.dlg-body p{margin:0 0 10px;color:var(--mask-muted);max-width:62ch}
.dlg-body p.lead{color:var(--mask-ink);font-size:1.05rem}
.dlg-body p.good{color:var(--good)}
.dlg-body p.bad{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opts .grp-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.opts .grp-list{display:flex;flex-direction:column;gap:8px}
.opts .grp-list button{text-align:left}
.opts button.answer{display:flex;align-items:center;gap:12px;text-align:left}
.opts button.answer .key{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--silk);font-family:var(--display);font-weight:700;font-size:.85rem}
.opts button.right{background:rgba(134,230,176,.18);border-color:var(--good);opacity:1}
.opts button.wrong{background:rgba(255,180,168,.16);border-color:var(--bad);opacity:1}

/* menu */
.brand-sub{margin:0 0 18px;color:var(--mask-muted);max-width:52ch}
.rank{margin:0 0 18px;max-width:30rem}
.rank-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-weight:700;font-size:1.05rem}
.rank-row span:last-child{font-weight:600;color:var(--mask-muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.trace{position:relative;height:8px;margin:8px 0 6px;border-radius:4px;background:rgba(0,0,0,.3)}
.trace i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#d9934e}
.rank-next{margin:0;font-size:.85rem;color:var(--mask-muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:9rem;padding:14px;border-radius:8px;background:var(--mask-2);
  border:1.5px solid rgba(238,246,240,.25);text-align:left}
.tile .nm{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.15}
.tile .sb{font-weight:500;font-size:.82rem;line-height:1.3;color:var(--mask-muted)}
.tile .st{margin-top:auto;display:flex;gap:5px;align-items:center}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1.5px rgba(238,246,240,.4)}
.dot.on{background:radial-gradient(circle at 34% 30%,#fff 0 16%,#dfe3e5 30%,#8e979c 100%);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.badge{font-size:.8rem;font-weight:600;padding:4px 9px;border-radius:999px;border:1.5px solid rgba(238,246,240,.28);color:var(--mask-muted)}
.badge.got{border-color:var(--gold);color:var(--gold)}

/* wyniki */
.stars{display:flex;gap:14px;margin:4px 0 18px}
.stars .dot{width:46px;height:46px}
.stars .dot.on{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.stars .dot:nth-child(2){animation-delay:.25s}
.stars .dot:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{padding:10px 12px;border-radius:6px;background:var(--mask-3)}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mask-muted)}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast .t{background:var(--mask);color:var(--mask-ink);border:1.5px solid var(--gold);border-radius:8px;padding:10px 14px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.3)}

@media (max-width:640px){
  .hud{flex-direction:column;align-items:stretch;gap:6px}
  .score-card{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 18px;min-width:0;text-align:left}
  .score{font-size:1.35rem}
  .combo,.timer{margin:0}
  .hud-card{width:100%;padding:16px 16px 12px}
  .hud h1{font-size:1rem}
  .hint{font-size:.88rem;min-height:0}
  .dialog{padding:24px 18px 18px}
  .levels{grid-template-columns:repeat(auto-fill,minmax(8.3rem,1fr));gap:8px}
  .tile{min-height:7.6rem;padding:12px}
  #solderBtn{min-width:9rem}
}
@media (hover:none){ #solderBtn small{display:none} }
@media (prefers-reduced-motion: reduce){ .stars .dot.on{animation:none} }
</style>
</head>
<body>
<div id="stage"></div>

<div id="loading" class="loading">
  <p class="t">Gorący Grot</p>
  <p id="loadMsg">Nagrzewam lutownicę…</p>
</div>

<header class="hud" id="hud" hidden>
  <section class="pcb hud-card">
    <div class="hud-head"><span class="chip" id="hudCode">L1</span><span id="hudName"></span></div>
    <div class="prog" id="hudProg" aria-hidden="true"></div>
    <h1 id="hudTitle"></h1>
    <p class="hint" id="hudHint"></p>
    <div class="meters" id="hudMeters">
      <div class="meter">
        <div class="lbl"><span>Temperatura</span><b id="heatTxt"></b></div>
        <div class="bar"><i class="fill" id="heatFill"></i><b class="zone" id="heatZone"></b></div>
      </div>
      <div class="meter">
        <div class="lbl"><span>Cyna</span><b id="solderTxt"></b></div>
        <div class="bar"><i class="fill solder" id="solderFill"></i><b class="zone" id="solderZone"></b></div>
      </div>
    </div>
    <p class="feedback" id="hudFeedback" aria-live="polite"></p>
  </section>
  <section class="pcb score-card">
    <p class="score"><span id="scoreNum">0</span><small>pkt</small></p>
    <p class="combo" id="comboTxt"></p>
    <p class="timer" id="timerTxt"></p>
  </section>
</header>

<footer class="controls" id="controls" hidden>
  <button id="solderBtn" type="button" aria-pressed="false">Podaj cynę<small>lub przytrzymaj spację</small></button>
  <span class="spacer"></span>
  <button id="pauseBtn" type="button">Pauza</button>
</footer>

<div id="dlg" class="overlay" hidden>
  <section class="pcb dialog" id="dlgBox" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head"><span class="chip" id="dlgChip" hidden></span><h2 id="dlgTitle"></h2></div>
    <div id="dlgBody" class="dlg-body"></div>
    <div id="dlgOpts" class="opts"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
window.addEventListener('error', function(e){ var l = document.getElementById('loading'), m = document.getElementById('loadMsg'); if (l && !l.hidden && m) m.textContent = 'Coś poszło nie tak: ' + (e.message || e.error) + '. Odśwież stronę.'; });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if (!window.THREE){ document.getElementById('loadMsg').textContent = 'Nie udało się wczytać biblioteki 3D. Sprawdź połączenie z internetem i odśwież stronę.'; return; }
// ======================================================================
// a_core: stałe, parametry lutów, zapis postępu, rangi, odznaki, dźwięk
// ======================================================================
var $ = function (id) { return document.getElementById(id); };
var DEBUG = /[?&]debug\b/.test(location.search);
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var MM = 0.006;                          // 1 mm prawdziwej płytki = 6 mm w grze (model powiększony 6x)
var TABLE_TOP = 0.76, HOLD_H = 0.075, BOARD_Z = -0.40;
var TOP_MM = 0.8;                        // połowa grubości laminatu 1,6 mm
var BOARD_CY = TABLE_TOP + HOLD_H + TOP_MM * MM;
var BT = BOARD_CY + TOP_MM * MM;
var FEED = 0.8;                          // jednostki cyny na sekundę
var KINDS = {
  normal: { heatNeed:1.0, sMin:0.6, sIdeal:1.0, sMax:1.5, overheat:6, touch:0.0095, padR:0.9, note:'' },
  gnd:    { heatNeed:1.5, sMin:0.6, sIdeal:1.0, sMax:1.5, overheat:7, touch:0.0095, padR:0.9, note:'To pole masy: miedź dookoła odbiera ciepło, więc grzej trochę dłużej.' },
  big:    { heatNeed:2.2, sMin:1.1, sIdeal:1.6, sMax:2.3, overheat:9, touch:0.013, padR:1.5, note:'Duże pole złącza: więcej metalu, więc grzej dłużej i podaj więcej cyny.' }
};

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function ease(t){ t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function fmt(n){ return Math.round(n).toLocaleString('pl-PL'); }
function fmtMult(m){ return m.toFixed(2).replace(/0$/, '').replace('.', ','); }

// ---------- zapis postępu (tylko w tej przeglądarce) ----------
var SAVE_KEY = 'goracy-grot-v1';
function defaultSave(){ return { xp:0, stars:{}, best:{}, badges:{}, board:{}, tutorialDone:false, settings:{ sound:true, swap:false }, bench:null }; }
var save = (function(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw){
      var s = JSON.parse(raw), d = defaultSave(), k;
      for (k in d) if (!(k in s)) s[k] = d[k];
      for (k in d.settings) if (!(k in s.settings)) s.settings[k] = d.settings[k];
      return s;
    }
  } catch (_) {}
  return defaultSave();
})();
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }

// ---------- rangi i odznaki ----------
var RANKS = [ { xp:0, name:'Nowicjusz' }, { xp:300, name:'Praktykant' }, { xp:900, name:'Technik' }, { xp:1800, name:'Elektronik' }, { xp:3000, name:'Mistrz Lutu' } ];
function rankInfo(xp){
  var cur = RANKS[0], next = null;
  for (var i = 0; i < RANKS.length; i++){ if (xp >= RANKS[i].xp) cur = RANKS[i]; else { next = RANKS[i]; break; } }
  return { cur:cur, next:next, frac: next ? (xp - cur.xp) / (next.xp - cur.xp) : 1 };
}
var BADGES = [
  { id:'bhp',      name:'Bezpiecznik',   desc:'Quiz BHP bez pomyłki' },
  { id:'first',    name:'Pierwszy lut',  desc:'Twój pierwszy dobry lut' },
  { id:'combo5',   name:'Seria 5',       desc:'Pięć perfekcyjnych lutów z rzędu' },
  { id:'nocold',   name:'Zero zimnych',  desc:'Cały poziom bez zimnego lutu' },
  { id:'nobridge', name:'Bez mostków',   desc:'Scalak bez ani jednego mostka' },
  { id:'quick',    name:'Szybka ręka',   desc:'Perfekcyjny lut w mniej niż 3 sekundy' },
  { id:'blink',    name:'Migacz działa', desc:'Uruchomiony układ' },
  { id:'master',   name:'Mistrz Lutu',   desc:'Egzamin na trzy gwiazdki' },
  { id:'all3',     name:'Kolekcjoner',   desc:'Wszystkie poziomy na trzy gwiazdki' }
];
function badgeById(id){ for (var i = 0; i < BADGES.length; i++) if (BADGES[i].id === id) return BADGES[i]; return null; }

// ---------- dźwięk (syntezowany, bez plików) ----------
var audio = null, sizzleOn = false;
function initAudio(){
  if (audio){ if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    var ctx = new AC(), master = ctx.createGain();
    master.gain.value = save.settings.sound ? 1 : 0; master.connect(ctx.destination);
    var len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++){ var cr = Math.random() < 0.002 ? (Math.random() * 2 - 1) * 2.5 : 0; d[i] = (Math.random() * 2 - 1) * 0.35 + cr; }
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 4200; bp.Q.value = 0.8;
    var sg = ctx.createGain(); sg.gain.value = 0;
    src.connect(bp); bp.connect(sg); sg.connect(master); src.start();
    audio = { ctx:ctx, master:master, sizzle:sg };
  } catch (_) { audio = null; }
}
function setSound(on){ save.settings.sound = on; persist(); if (audio) audio.master.gain.setTargetAtTime(on ? 1 : 0, audio.ctx.currentTime, 0.02); }
function setSizzle(on){ if (!audio || on === sizzleOn) return; sizzleOn = on; audio.sizzle.gain.setTargetAtTime(on ? 0.16 : 0, audio.ctx.currentTime, on ? 0.04 : 0.12); }
function tone(f, dur, type, vol, delay, slide){
  if (!audio) return;
  var c = audio.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master); o.start(t); o.stop(t + dur + 0.05);
}

var PX_PER_MM = 28;
function paintSides(def, side, painter){
  var out = {}, W = def.W, D = def.D, k = PX_PER_MM;
  ['color', 'bump', 'rm'].forEach(function(pass){
    var c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(D * k);
    var g = c.getContext('2d');
    var P = side === 'top' ? function(x, z){ return [(x + W / 2) * k, (z + D / 2) * k]; } : function(x, z){ return [(x + W / 2) * k, (D / 2 - z) * k]; };
    painter(def, g, P, k, PASS[pass], c.width, c.height);
    if (pass === 'color') noise(g, c.width, c.height, 9);
    out[pass] = c;
  });
  return out;
}

  var rm = new THREE.CanvasTexture(maps.rm); rm.anisotropy = maxAniso; m.roughnessMap = rm; m.metalnessMap = rm;
  return m;

function disposeTree(o){

    if (n.geometry && !n.geometry._shared) n.geometry.dispose();
    if (n.material){ (Array.isArray(n.material) ? n.material : [n.material]).forEach(function(m){ if (m._shared) return; ['map', 'bumpMap', 'roughnessMap'].forEach(function(k){ if (m[k]) m[k].dispose(); }); m.dispose(); }); }
  });
}
[GEO.fillet, GEO.blob, GEO.flux, GEO.ring, GEO.resistor, sphereGeo].forEach(function(g){ g._shared = true; });
Object.keys(MAT).forEach(function(k){ MAT[k]._shared = true; });
function loadBoard(id){

  if (board){ while (boardPivot.children.length){ var ch = boardPivot.children[0]; boardPivot.remove(ch); disposeTree(ch); } }
  board = { def:def, comps:{}, joints:[], byRef:{}, led:null, termWire:null };
  board.mesh = new THREE.Mesh(new THREE.BoxGeometry(M(def.W), M(1.6), M(def.D)), (function(){
    var top = boardMaterial(paintSides(def, 'top', def.paintTop)), bot = boardMaterial(paintSides(def, 'bottom', def.paintBottom)), e = std({ color:def.edge, rough:0.7 });
    return [e, e, top, bot, e, e];

  def.comps.forEach(function(c){
    var g = new THREE.Group(); g.name = c.id; BUILDERS[c.type](c, g);
    g.traverse(function(n){ if (n.isMesh && !n.userData.noShadow){ n.castShadow = true; n.receiveShadow = true; } });
    boardPivot.add(g); board.comps[c.id] = g;
    c.pins.forEach(function(p){ var j = makeJoint(p); boardPivot.add(j.group); board.joints.push(j); board.byRef[p.ref] = j; });
  });

}

});

    if (!info.src) return;

    if (holdsIron){ info.grip.add(ironVR); ironSrc = info.src; } else { info.grip.add(wireVR); wireSrc = info.src; }

    var src = s.inputSources[i], gp = src.gamepad; if (!gp) continue;
    var st = padState.get(src); if (!st){ st = { b:[], stick:0, rep:0 }; padState.set(src, st); }
    var pressed = function(n){ return !!(gp.buttons[n] && gp.buttons[n].pressed); };
    [[0, 'select'], [4, 'select'], [5, 'back']].forEach(function(m){ var now = pressed(m[0]); if (now && !st.b[m[0]]) onVRAction(m[1], src); st.b[m[0]] = now; });
    var y = gp.axes.length > 3 ? gp.axes[3] : (gp.axes[1] || 0), dir = y < -0.6 ? -1 : (y > 0.6 ? 1 : 0);
    if (dir !== st.stick){ st.stick = dir; st.rep = 0.45; if (dir) onVRAction(dir < 0 ? 'up' : 'down', src); }

function updateVRTools(j, active){
  input.iron = false; input.solder = false;
  if (!active || !j) return;

    iron.tipPoint.getWorldPosition(tip);

    input.iron = best === j && bd < j.K.touch;

}

function updateFX(dt){
  smoke.forEach(function(p){
    if (!p.alive) return; p.life += dt; var L = p.life / 1.8;

    quizOk:0, quizN:0, timeLeft:0, timed:false, cool:0, exam:false, guided:false, newBadges:[], xp:0, circuit:null, hadBridgeRisk:false };
}
function curJoint(){ return run && run.targets[run.ti] ? run.targets[run.ti] : null; }
function multiplier(){ return 1 + Math.min(run.combo, 6) * 0.25; }
function award(id){
  if (save.badges[id]) return; save.badges[id] = Date.now(); persist();
  var b = badgeById(id); if (b){ run && run.newBadges.push(b); toast('Nowa odznaka: ' + b.name); sfx.badge(); }
}
function stepJoint(dt){
  var j = curJoint(); if (!j) return;
  var s = j.st, K = j.K;
  if (input.iron){ s.heat = Math.min(s.heat + dt, 4); s.contact += dt; } else s.heat = Math.max(0, s.heat - dt * 0.9);
  if (s.contact > K.overheat) s.overheat = true;

    else if (input.iron){ s.solder += dt * FEED * 0.6; s.cold += dt * FEED * 0.6; melting = true; }
    else noMelt = true;
    if (melting && s.first < 0) s.first = s.contact;

  prevIron = input.iron;

var RESULT_TXT = {
  good:'Dobry lut: błyszczący, wklęsły stożek.',
  cold:'Zimny lut: cyna trafiła na niedogrzane połączenie, jest matowa i może nie przewodzić. Najpierw grzej, potem podawaj cynę.',
  much:'Za dużo cyny: zamiast stożka powstała kulka. Odsuń cynę wcześniej.',
  little:'Za mało cyny: pole nie jest całe pokryte. Podawaj cynę odrobinę dłużej.',
  bridge:'Mostek: nadmiar cyny połączył dwa sąsiednie pola. W prawdziwym układzie to zwarcie.',
  overheat:'Przegrzanie: grot był przyłożony za długo, pole się przypaliło i może odpaść od płytki.'
};
var RESULT_SHORT = { good:'dobry', cold:'zimny lut', much:'za dużo cyny', little:'za mało cyny', bridge:'mostek', overheat:'przegrzane pole' };
function finishJoint(j, solderStillOn){
  var s = j.st, K = j.K, coldRatio = s.solder > 0 ? s.cold / s.solder : 0, res;

    var dev = s.solder >= K.sIdeal ? (s.solder - K.sIdeal) / (K.sMax - K.sIdeal) : (K.sIdeal - s.solder) / (K.sIdeal - K.sMin);

// ---------- test układu: migacz 555 ----------
var power = null, wires = [];
function evalCircuit(getSt){
  var shorts = [], opens = [], flick = [], weak = [];
  board.joints.forEach(function(j){
    var s = getSt(j);
    if (!s || !s.done){ opens.push(j); return; }
    if (s.result === 'bridge'){ var o = board.byRef[s.bridgeTo]; if (o && o.pin.net !== j.pin.net) shorts.push(j); }
    else if (s.result === 'overheat') opens.push(j);
    else if (s.result === 'cold') flick.push(j);
    else if (s.result === 'little') weak.push(j);
  });
  var outcome = shorts.length ? 'short' : (opens.length ? 'dead' : (flick.length ? 'flicker' : 'works'));
  return { outcome:outcome, shorts:shorts, opens:opens, flick:flick, weak:weak };
}
function jointName(j){ var c = j.pin.comp, p = j.pin; return c + (p.lab ? ' (' + p.lab + ')' : ' nóżka ' + p.n); }
function circuitText(ev){
  var list = function(a){ return a.slice(0, 3).map(jointName).join(', ') + (a.length > 3 ? ' i ' + (a.length - 3) + ' inne' : ''); };
  if (ev.outcome === 'works') return 'Dioda miga mniej więcej raz na sekundę (f ≈ 0,99 Hz przy R1 = 10 kΩ, R2 = 68 kΩ, C1 = 10 µF). Układ działa!' + (ev.weak.length ? ' Słabsze luty z małą ilością cyny: ' + list(ev.weak) + '. Działają, ale mogą się z czasem poluzować.' : '');
  if (ev.outcome === 'short') return 'Zwarcie! Mostek przy ' + list(ev.shorts) + ' łączy dwa różne obwody. Dioda nie świeci, a bateria się grzeje.';
  if (ev.outcome === 'dead') return 'Dioda nie świeci: brak połączenia przy ' + list(ev.opens) + '.';
  return 'Dioda miga nieregularnie i gaśnie. Winne są zimne luty: ' + list(ev.flick) + '. Tak wygląda typowa usterka w prawdziwych urządzeniach.';
}
function makeWireMesh(a, b, color){

  var curve = new THREE.CatmullRomCurve3([a, a.clone().lerp(mid, 0.5).add(V3(0, 0.02, 0)), mid, mid.clone().lerp(b, 0.5).add(V3(0, 0.015, 0)), b]);
  var m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.0022, 8, false), std({ color:color, rough:0.45 }));
  m.castShadow = true; return m;
}

  batteryGroup.visible = true; bench.updateMatrixWorld(true); boardPivot.updateMatrixWorld(true);
  var snapW = batteryGroup.localToWorld(V3(-0.032, 0.002, 0));
  board.termWire.forEach(function(lp, i){
    var end = boardPivot.localToWorld(lp.clone()), start = snapW.clone().add(V3(0, 0, i ? -0.005 : 0.005));
    var m = makeWireMesh(start, end, i ? 0x1d1f21 : 0xc62f25); scene.add(m); wires.push(m);

function startPower(ev, done){

  shot = 'show'; flipBoard(Math.PI, 1.4, function(){ connectBattery(); sfx.power(); power.phase = 1; });

function updatePower(dt){
  if (!power) return;
  power.t += dt;
  if (power.phase >= 1 && power.t > 0){
    var o = power.ev.outcome, on = 0;
    if (o === 'works'){ var ph = power.t % 1.01; on = ph < 0.54 ? 1 : 0; }
    else if (o === 'flicker'){ on = Math.random() < ((power.t % 3) < 0.8 ? 0.45 : 0.06) ? Math.random() : 0; }
    setLed(on);
    if (o === 'works' && power.lastOn !== on){ if (on && power.phase === 1) sfx.tick(); power.lastOn = on; }
    if (power.phase === 1 && power.t > 4.5){ power.phase = 2; power.done(); }
  }

// ---------- HUD ----------
function hintFor(j){
  if (game.state === 'cool') return 'Lut stygnie. Nie ruszaj płytki.';
  if (!j) return '';
  var s = j.st, K = j.K, vr = renderer.xr.isPresenting;
  var feedHow = vr ? 'dotknij drutem cyny nóżki' : (isTouch ? 'przytrzymaj przycisk „Podaj cynę”' : 'przytrzymaj spację');
  var touchHow = vr ? 'Dotknij grotem' : (isTouch ? 'Przytrzymaj palec na' : 'Przytrzymaj przycisk myszy na');
  if (run.guided){
    if (noMelt) return 'Cyna się nie topi, bo połączenie jest zimne. Najpierw grot, potem cyna.';
    if (!input.iron && s.solder <= 0.01) return touchHow + ' zaznaczonym polu. Grot ma dotykać jednocześnie pola i nóżki.';
    if (input.iron && s.heat < K.heatNeed && s.solder <= 0.01) return 'Trzymaj grot i patrz na pierścień. Gdy zrobi się zielony, połączenie jest gorące.';
    if (input.iron && s.solder < K.sIdeal * 0.85) return 'Gorące! Teraz ' + feedHow + ', z drugiej strony niż grot.';
    if (input.iron && input.solder) return 'Wystarczy cyny. Odsuń cynę' + (vr ? '.' : (isTouch ? ': puść przycisk.' : ': puść spację.'));
    if (input.iron) return 'Na końcu odsuń grot' + (vr ? '.' : (isTouch ? ': podnieś palec.' : ': puść przycisk myszy.'));
    return 'Przyłóż grot ponownie i dokończ lut.';
  }
  if (run.exam) return noMelt ? 'Cyna się nie topi.' : (input.iron ? (melting ? 'Cyna płynie…' : 'Grzejesz…') : 'Patrz na cynę, nie na wskaźniki.');
  if (noMelt) return 'Cyna się nie topi. Najpierw rozgrzej połączenie grotem.';
  if (input.iron && s.contact > K.overheat - 1.5) return 'Za długo! Odsuń cynę i grot.';
  if (!input.iron && s.solder <= 0.01) return touchHow + ' polu i nóżce.' + (K.note ? ' ' + K.note : '');
  if (input.iron && s.heat < K.heatNeed && s.solder <= 0.01) return 'Grzejesz. Czekaj na zieloną strefę.';
  if (input.iron && s.solder <= 0.01) return 'Gorące. Podaj cynę.';
  if (input.iron && s.solder < K.sMin) return 'Podawaj cynę, aż powstanie stożek.';
  if (input.iron) return 'Wystarczy? Odsuń cynę, potem grot.';
  return 'Przyłóż grot ponownie.';
}
function computeHud(){
  var L = run.level, j = curJoint(), s = j ? j.st : null;
  var prog = run.targets.map(function(t, i){ return t.st.done ? (t.st.result === 'good' ? 'good' : 'bad') : (i === run.ti ? 'now' : ''); });
  var long = !!(s && input.iron && s.contact > j.K.overheat - 1.5);

  return { code:L.code, name:L.name, title:j ? 'Lut ' + (run.ti + 1) + ' z ' + run.targets.length + ': ' + jointLabel(j) : L.name, hint:hintFor(j), guided:run.guided,
    meters:!run.exam && !!j, heatFrac:s ? Math.min(1, s.heat / (j.K.heatNeed * 1.7)) : 0, long:long,

var ringMat = new THREE.MeshBasicMaterial({ color:C(0x5ec8f2), transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false, toneMapped:false });

ringMesh.visible = false; ringMesh.renderOrder = 2; scene.add(ringMesh);
var RING = { idle:C(0x5ec8f2), heat:C(0xffa24c), ok:C(0x62c584), bad:C(0xf2806a), sample:C(0x9be7ff), exam:C(0xeef2f5) };
function updateRing(){

  if (game.state === 'samples' && run && run.sample){ j = run.sample; col = RING.sample; }

    var before = Math.ceil(run.timeLeft); run.timeLeft -= dt;
    if (run.timeLeft <= 10 && Math.ceil(run.timeLeft) !== before) sfx.tick();
    if (run.timeLeft <= 0){ run.timeLeft = 0; endSolderStep(true); }
  }
  if (melting && j) emitSmoke(j.world, rdt);
  setSizzle(melting);
  if (inXR && frameN % 8 === 0){ if (input.iron) pulse(ironSrc, 0.12, 30); if (melting) pulse(wireSrc, 0.1, 30); }
  updateFX(rdt); updateFlip(rdt); updatePower(rdt); updateRing();
  updateCamera(rdt, game.t);
  var h = run && (game.state === 'play' || game.state === 'cool' || game.state === 'pause') ? computeHud() : null;
  if (h && !$('hud').hidden) renderHud(h);
  updatePanel(rdt, h && game.state !== 'pause' ? h : null);
}

// ---------- start ----------
$('pauseBtn').addEventListener('click', function(){ pauseGame(); });
window.addEventListener('resize', function(){ if (renderer.xr.isPresenting) return; renderer.setSize(window.innerWidth, window.innerHeight); fitCamera(); });
if (navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(function(ok){ xrSupport.vr = !!ok; if (game.state === 'menu' && dlg.m && dlg.m.cls === 'menu') openMenu(); }).catch(function(){});
  navigator.xr.isSessionSupported('immersive-ar').then(function(ok){ xrSupport.ar = !!ok; if (game.state === 'menu' && dlg.m && dlg.m.cls === 'menu') openMenu(); }).catch(function(){});
}
var initDone = false;
function init(){
  if (initDone) return; initDone = true;
  scene.traverse(function(n){ if (n.isMesh && !n.userData.noShadow){ n.receiveShadow = true; n.castShadow = !n.userData.noCast; } });
  loadBoard('blink'); restoreStory(null); showComps(null); refreshJointWorld(); placeRestingTools();
  $('loading').hidden = true; openMenu();
  if (!save.tutorialDone && !save.stars.tut){
    showDialog({ chip:'GG', title:'Witaj przy stole lutowniczym', body:'<p class="lead">Nauczysz się lutować elementy przewlekane i złożysz migacz z układem 555. Za dobre luty dostajesz punkty, gwiazdki i rangi.</p><p>Zacznij od szkolenia. Trwa około trzech minut.</p>',
      vr:['Nauczysz się lutować i złożysz migacz z układem 555. Zacznij od szkolenia.'],
      opts:[ { label:'Zacznij szkolenie', primary:true, act:function(){ startLevel(LEVELS[0]); } }, { label:'Pokaż menu', act:openMenu } ] });
  }
  renderer.setAnimationLoop(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ panelDirty = true; });
}
if (DEBUG){
  window.GG = { game:game, levels:LEVELS, save:function(){ return save; }, start:function(i){ startLevel(LEVELS[i]); }, next:function(){ hideDialog(); nextStep(); },
    auto:function(mode){ auto = mode ? { mode:mode } : null; }, speed:function(v){ game.speed = v; }, run:function(){ return run; },
    choose:function(n){ var l = (dlg.m && dlg.m.opts || []).filter(function(o){ return !o.vrOnly && !o.disabled; }); if (l[n]) chooseOption(l[n]); }, dialog:function(){ return dlg.m && dlg.m.title; },
    stop:function(){ renderer.setAnimationLoop(null); }, play:function(){ clock.getDelta(); renderer.setAnimationLoop(loop); }, frame:function(){ renderer.render(scene, camera); },
    sim:function(sec, step){ step = step || 0.05; for (var t = 0; t < sec; t += step) update(step); return game.state; }, j:function(){ var c = curJoint(); return c ? { ref:c.ref, st:c.st } : null; },
    panelShot:function(){ var h = run && (game.state === 'play' || game.state === 'cool') ? computeHud() : null; if (game.state === 'calib') drawCalibPanel(); else if (dlg.m) drawDialogPanel(dlg.m); else if (h) drawHudPanel(h); return pc.toDataURL('image/png'); },
    led:function(v){ setLed(v); }, flip:function(a){ boardPivot.rotation.x = a; }, menu:function(){ openMenu(); },
    joints:function(){ return board.joints.map(function(x){ return x.ref + '=' + (x.st.result || '-'); }).join(' '); }, ev:function(){ return run && run.circuit; }, shot:function(s){ shot = s; camSnap = true; } };
}
var fontWait = setTimeout(init, 1500);
if (document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('600 20px Barlow'), document.fonts.load('700 20px "Chakra Petch"')]).then(function(){ clearTimeout(fontWait); setTimeout(init, 30); }).catch(function(){});
}


})();
</script>
